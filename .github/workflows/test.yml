name: Test installed package and local API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/jep-api
          ref: f606050a5779ee81c332cc028ab1137ff57a443c
          path: .test-api
      - run: python -m pip install build twine '.[test]' -r .test-api/requirements.txt
      - run: python -m pytest -q
        env:
          JEP_API_SOURCE: .test-api
      - run: python -m build && python -m twine check dist/*
